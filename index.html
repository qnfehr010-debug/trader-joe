header .cover{position:absolute;left:21%;width:50.6%;top:39.6%;bottom:0;background:#f1f1ef;border:1px solid #333;border-bottom:0;box-shadow:inset 0 0 0 3px #f1f1ef,inset 0 0 0 4px #bbb;display:flex;align-items:center;justify-content:center;padding-bottom:26px}
header h1{margin:0;line-height:0;width:66%}
header h1 img{width:100%;height:auto}
.notice{max-width:900px;margin:-26px auto 0;padding:0 12px;position:relative;z-index:2}
.notice .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px #00000014}
.notice ul{margin:0;padding:0;list-style:none}
.notice li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;padding:6px 0}
.notice li+li{border-top:1px dashed var(--line)}
.notice .ic{flex:0 0 22px;font-size:16px;line-height:1.4}
.notice small{color:var(--mute)}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}
.name{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.name label{font-weight:700;font-size:14px}
.name input{width:100%;font-size:16px;padding:10px;margin-top:6px;border:1px solid var(--line);border-radius:8px}
h2{font-size:15px;margin:22px 4px 8px;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.item.on{border-color:var(--red);box-shadow:0 0 0 2px #c8102e22}
.item img{width:100%;aspect-ratio:1;object-fit:contain;background:#f4f1ea;border-radius:8px}
.item .t{font-size:13px;line-height:1.35;margin:8px 0 2px;min-height:34px}
.item .p{font-size:12px;color:var(--mute)}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.qty button:active{background:var(--line)}
.qty span{font-size:18px;font-weight:700;min-width:30px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:14px}
.bar button{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer}
.bar button:disabled{opacity:.5}
.msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:9;max-width:90%}
.live{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.live .lh{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:10px}
.live .lh span{font-size:12px;color:var(--mute)}
.lrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.lrow .nm{line-height:1.3}
.lrow .tr{background:#f1ece3;border-radius:6px;height:14px;overflow:hidden}
.lrow .fl{height:100%;background:linear-gradient(90deg,#e0384f,var(--red));border-radius:6px;transition:width .6s}
.lrow .ct{text-align:right;font-weight:700}
.lempty{padding:14px;text-align:center;color:var(--mute);font-size:13px}
.live .lf{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:8px}
.note{font-size:12px;color:var(--mute);margin:18px 4px;line-height:1.5}
</style>

const qty = {};
const $ = id => document.getElementById(id);

function render(){
  const groups = {};
  P.forEach(p => (groups[p[2]] = groups[p[2]] || []).push(p));
  $("list").innerHTML = Object.entries(groups).map(([g, items]) =>
    `<h2>${g}</h2><div class="grid">` + items.map(p => `
    <div class="item" id="c${p[0]}">
      <img loading="lazy" referrerpolicy="no-referrer" src="${p[4]}?type=m" alt="${p[1]}">
      <div class="t">${p[1]}</div>
      <div class="p">${p[3] === "-" ? "KREAM(한국 내 판매 가격) 없음" : "KREAM(한국 내 판매 가격) " + p[3] + "원"}</div>
      <div class="qty">
        <button onclick="chg('${p[0]}',-1)">−</button><span id="q${p[0]}">0</span><button onclick="chg('${p[0]}',1)">+</button>
      </div>
    </div>`).join("") + `</div>`).join("");
  P.forEach(p => paint(p[0]));
  total();
}
function paint(id){
  const n = qty[id] || 0;
  $("q" + id).textContent = n;
  $("c" + id).classList.toggle("on", n > 0);
}
function chg(id, d){
  qty[id] = Math.max(0, Math.min(20, (qty[id] || 0) + d));
  paint(id); total();
}
function total(){
  const v = Object.values(qty).filter(n => n > 0);
  $("sum").textContent = `선택 ${v.length}종 · ${v.reduce((a, b) => a + b, 0)}개`;
}
function toast(t){ const m = $("msg"); m.textContent = t; m.style.display = "block"; setTimeout(() => m.style.display = "none", 3000); }

const H = {apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json"};
const norm = s => s.trim().replace(/\s+/g, " ");

async function loadPrev(){
  const name = norm($("who").value);
  if (!name || SUPABASE_URL.includes("YOUR-")) return;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/tj_bag_wishes?select=product_id,qty&name=eq.${encodeURIComponent(name)}`, {headers: H});
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows.length) return;
    P.forEach(p => qty[p[0]] = 0);
    rows.forEach(x => qty[x.product_id] = x.qty);
    P.forEach(p => paint(p[0])); total();
    toast("이전 선택을 불러왔어요");
  }catch(e){}
}
$("who").addEventListener("change", loadPrev);
try{ $("who").value = localStorage.getItem("tj_name") || ""; }catch(e){}

$("submit").onclick = async () => {
  const name = norm($("who").value);
  if (!name) return toast("이름을 입력해 주세요");
  if (SUPABASE_URL.includes("YOUR-")) return toast("Supabase 설정이 필요합니다 (index.html 상단)");
  const rows = P.map(p => ({name, product_id: p[0], product_name: p[1], series: p[2], qty: qty[p[0]] || 0}));
  $("submit").disabled = true;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/tj_bag_wishes?on_conflict=name,product_id`, {
      method: "POST",
      headers: {...H, Prefer: "resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify(rows)
    });
    if (!r.ok) throw new Error(await r.text());
    try{ localStorage.setItem("tj_name", name); }catch(e){}
    toast("제출 완료! 감사합니다 🙏 (수정은 같은 이름으로 다시 제출)");
    loadLive();
  }catch(e){ toast("제출 실패: " + e.message.slice(0, 80)); }
  $("submit").disabled = false;
};
async function loadLive(){
  if (SUPABASE_URL.includes("YOUR-")) return;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/tj_bag_wishes?select=product_id,qty,name&qty=gt.0`, {headers: H});
    if (!r.ok) throw 0;
    const rows = await r.json();
    const sum = {};
    rows.forEach(x => sum[x.product_id] = (sum[x.product_id] || 0) + x.qty);
    const list = P.filter(p => sum[p[0]]).map(p => ({n: p[1], q: sum[p[0]]})).sort((a, b) => b.q - a.q);
    const max = list.length ? list[0].q : 1;
    $("liveTot").textContent = `${new Set(rows.map(x => x.name)).size}명 · 총 ${rows.reduce((a, x) => a + x.qty, 0)}개`;
    $("liveBars").innerHTML = list.length ? list.map(x => `<div class="lrow"><div class="nm">${x.n}</div><div class="tr"><div class="fl" style="width:${Math.max(4, x.q / max * 100)}%"></div></div><div class="ct">${x.q}</div></div>`).join("") : '<div class="lempty">아직 예약이 없습니다.</div>';
    $("liveUpd").textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit"});
  }catch(e){ if (!$("liveUpd").textContent) $("liveBars").innerHTML = '<div class="lempty">현황을 불러오지 못했습니다.</div>'; }
}
loadLive();
setInterval(loadLive, 5 * 60 * 1000);
render();
if ($("who").value) loadPrev();
</script>
